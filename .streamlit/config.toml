[theme]
base = "light"
primaryColor = "#0b6e78"
backgroundColor = "#f4f6f7"
secondaryBackgroundColor = "#e9eef1"
textColor = "#14212b"
font = "sans serif"

[server]
# headless avoids Streamlit's first-run email prompt in the terminal;
# `python -m netmind dashboard` opens the browser itself.
headless = true

[browser]
gatherUsageStats = false
