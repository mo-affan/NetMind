[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"

[server]
# headless avoids Streamlit's first-run email prompt in the terminal;
# `python -m netmind dashboard` opens the browser itself.
headless = true

[browser]
gatherUsageStats = false
